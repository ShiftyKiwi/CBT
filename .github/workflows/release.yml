name: Release Build and Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build release artifacts and update pluginmaster
    runs-on: windows-2022

    env:
      PLUGIN_NAME: CBT
      DALAMUD_VERSION_URL: "https://goatcorp.github.io/dalamud-distrib/stg/latest.zip"
      PLUGINMASTER_PATH: pluginmaster.json

    steps:
      - name: Checkout and Initialise
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x.x'

      - name: Cache Dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/${{ env.PLUGIN_NAME }}.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Download and extract Dalamud
        run: |
          New-Item -ItemType Directory -Path "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force | Out-Null
          Invoke-WebRequest -Uri "${{ env.DALAMUD_VERSION_URL }}" -OutFile "dalamud.zip"
          Expand-Archive -Path "dalamud.zip" -DestinationPath "$env:AppData\XIVLauncher\addon\Hooks\dev" -Force

      - name: Build Release
        id: build_step
        run: |
          dotnet restore `
            && dotnet build --no-restore --configuration Release `
            && dotnet test --no-build --configuration Release

      - name: Prepare zip file
        run: |
          mkdir output -Force
          Copy-Item "${{ env.PLUGIN_NAME }}/bin/Release/${{ env.PLUGIN_NAME }}.json" -Destination output/${{ env.PLUGIN_NAME }}.json -Force
          Compress-Archive -Path ${{ env.PLUGIN_NAME }}/bin/Release/* -DestinationPath output/latest.zip -Force

      - name: Upload zip to GitHub release
        uses: softprops/action-gh-release@v1
        with:
          files: output/latest.zip

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $pluginJsonPath = "${{ env.PLUGIN_NAME }}/bin/Release/${{ env.PLUGIN_NAME }}.json"
          $pluginJson = Get-Content $pluginJsonPath -Raw | ConvertFrom-Json
          $repoUrl = "https://github.com/${{ github.repository }}"
          $rawBase = "https://raw.githubusercontent.com/${{ github.repository }}/main"
          $downloadUrl = "$repoUrl/releases/latest/download/latest.zip"
          $lastUpdated = [int][double]::Parse((Get-Date -UFormat %s))

          $pluginMaster = @(
            [ordered]@{
              Author = $pluginJson.Author
              Name = $pluginJson.Name
              Description = $pluginJson.Description
              InternalName = $pluginJson.InternalName
              AssemblyVersion = $pluginJson.AssemblyVersion
              RepoUrl = $repoUrl
              ApplicableVersion = $pluginJson.ApplicableVersion
              Tags = $pluginJson.Tags
              DalamudApiLevel = $pluginJson.DalamudApiLevel
              DownloadLinkInstall = $downloadUrl
              IconUrl = "$rawBase/res/icon.png"
              IsHide = $false
              IsTestingExclusive = $false
              DownloadLinkTesting = $downloadUrl
              DownloadLinkUpdate = $downloadUrl
              DownloadCount = 0
              LastUpdated = $lastUpdated
            }
          )

          git fetch origin main
          git checkout main
          $pluginMaster | ConvertTo-Json -Depth 100 | Set-Content "${{ env.PLUGINMASTER_PATH }}"

      - name: Commit and push pluginmaster.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ${{ env.PLUGINMASTER_PATH }}
          git diff --cached --quiet && exit 0
          git commit -m "Update pluginmaster for ${{ github.event.release.tag_name }}"
          git push origin HEAD:main
